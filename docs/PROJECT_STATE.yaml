      - "Competent route reaches Proto-cell at ~09:05; optimized at ~08:12; competent+M04 at ~09:15."
      - "M02 remains later than ideal target (~03:10 competent) to avoid node-cost changes and clicker-dominant manual play."
  last_iteration_2_micro_fix:
