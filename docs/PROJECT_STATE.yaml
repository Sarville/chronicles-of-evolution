  canonical_plan: "docs/production/TIMELINE_01_REBUILD_PLAN.md"
  preserved_baseline: "timeline1-v2-reconciled biological 0-18, subject to explicit full-run validation"
  blocker_for_t2_runtime: "T1-7 full-run regression and manual fresh-state playtest"

