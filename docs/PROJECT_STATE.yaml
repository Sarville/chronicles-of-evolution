    - "fixed dangling ATP visibleFromEra ('METABOLISM' -> 'CELLULAR')"
    - "dev/simulation.js generalized past M06 through C06, plus a Symbiosis (C02B) branch-variant profile"
  consistency_fix_2026-09-16:
    - "Initial implementation (79e7b93e) wired C01/C03/C05/C06 to goalIds G006-G009 directly by node order, colliding with the canonical G006-G009 contract in docs/gdd/07_GOALS_AND_MILESTONES.md and docs/scenario/01_TIMELINE_01_SCRIPT.md (G008=AP/adaptations, G009=Multicellularity MS02, neither of which exists yet). Found while checking DS-05 narrative consistency and corrected in the same session: goals.js now has exactly G006 (composite: C01 + branch_selected) and G007 (nodeId C06, folds Protein Synthesis+Organelles+Cell Coordination); the premature 1 AP grant, the 'ap' resource, and the invented MS_CELL_COORDINATION milestone were removed. Added two small reusable engine primitives: 'branch_selected' goal condition and 'set_flag' node effect (used for the run.bio.* flags above)."
  automated_gate:
    - "npm run test:config / test:domain / test:sim / test:ui / test / smoke / build all pass"
    - "competent-profile simulation: Metabolism ~11.3min, branch ~12.1min, Protein Synthesis ~13.75min, Organelles ~14.75min, Cell Coordination ~15.9min (G006 target 11-14min, G007 target 15-20min per canon: both hit)"
  note: "Closed by direct user confirmation on 2026-09-16, ahead of a manual 10-18 playtest pass. Automated tests/simulation/build back the implementation, and goal-ID alignment with GDD/DS-05 canon is now verified; treat exact 10-18 numbers as provisional (see balance.biological_10_18) until an actual playtest happens."

