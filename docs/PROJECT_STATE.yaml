workflow:
  user_review_required_before_session_done: true
  state_update_required_at_session_end: true
  todo_update_required_at_session_end: true
  decisions_update_when_needed: true
  push_after_approval: true
  no_game_code_during_design_sessions: true

design:
  current_session: "ACT-STRUCTURE-REDESIGN"
  status: "act_structure_direction_accepted_pending_chapter_design"
  objective: "Resolve docs/DECISIONS_ACT_STRUCTURE.md ACT-006 open questions (per-chapter minute budget, Bioseed's fate, T2/T4 skin-swap mechanics, P1-P3 naming) into a concrete T1-T5 chapter implementation plan, then rewrite ACT-007's document list (12_LONG_TERM_PROGRESSION_AND_RESET_ROADMAP.md, TIMELINE_01_REBUILD_PLAN.md, scenario/*, 07_GOALS_AND_MILESTONES.md). Prior objective (rebuild T1 Origin RNA->Ash as one 180min run) is superseded, not deleted: see 'previous_design_objective' below and ACT-005 for how it's reused."
  previous_design_objective: "Rebuild the complete T1 Origin from RNA to mandatory Ash/reset; begin with T1-0 Event Engine and 0-18 audit (superseded 2026-09-17 by docs/DECISIONS_ACT_STRUCTURE.md; T1-0..T1-6 delivery below remains valid as Act 1's reuse baseline)"
  accepted_reconciliation:
    - "RNA -> replication -> DNA -> membrane -> Cell restored as early gameplay language"
    - "Information removed as player-facing spendable resource"
    - "Chemical Gradient / Catalytic Fold / Energy Pocket removed from canonical player-facing gameplay"
    - "ATP introduced through metabolism rather than at game start; original late psychic Energy remains a distinct future resource"
    - "first biological branch restored to Absorption / Symbiosis / Shell"
    - "Photosynthesis / Chemosynthesis retained as optional metabolic adaptations"
    - "Adaptation Points restored as milestone/side-objective currency for optional adaptations"
    - "Cognition 0..100 restored; Sapience becomes condition-driven convergence"
    - "civilization starts as small group around Population 5"
    - "Power moved to Industry/electrification layer"
    - "Modern bridge restored before Atomic"
    - "Goal Engine, branching/data config, save/recovery, dev simulation and telemetry preserved"
    - "Stability/World Tension, Error 17, Again, Ash, Archive, idempotent reset and Timeline #2 preserved"
    - "Release 1 target is first Bioseed in T5, not only the Timeline #2 teaser"
    - "Long-term roadmap assigns retained Evolve system families to T1/T2/T3/T4/T5/P1+/U1+"
    - "Procedural minor/major events return in T1 through one persisted Event Engine"
  canonical_documents:
    - "docs/DECISIONS_RECONCILIATION.md"
    - "docs/gdd/01_FIRST_120_MINUTES.md"
    - "docs/gdd/02_ECONOMY_FIRST_120_MINUTES.md"
    - "docs/gdd/03_EVOLUTION_TREE.md"
    - "docs/gdd/04_CIVILIZATION_PROGRESSION.md"
    - "docs/gdd/05_BUILDINGS_AND_JOBS.md"
    - "docs/gdd/06_TECH_TREE.md"
    - "docs/gdd/07_GOALS_AND_MILESTONES.md"
    - "docs/gdd/08_EVENTS_AND_CHOICES.md"
    - "docs/gdd/09_ENDINGS_AND_RESET.md"
    - "docs/gdd/10_META_PROGRESSION.md"
    - "docs/gdd/11_BALANCE_RULES.md"
    - "docs/gdd/12_LONG_TERM_PROGRESSION_AND_RESET_ROADMAP.md"
  narrative_review_documents:
    - "docs/scenario/01_TIMELINE_01_SCRIPT.md"
    - "docs/scenario/04_STORY_EVENTS.md"
    - "docs/scenario/05_NARRATIVE_FLAGS.md"
    - "docs/scenario/06_ENDINGS_COPY.md"
    - "docs/scenario/07_COPY_GUIDE.md"
  presentation_review_documents:
    - "docs/ux/00_TIMELINE_PRESENTATION_MAP.md"
    - "docs/art/00_VISUAL_STATE_MAP.md"
  presentation_contract:
    world_states: "V0 Primordial -> V1 Cellular -> V2 Creature -> V3 Sapient Tribe -> V4 Settlement -> V5 City -> V6 Industrial -> V7 Modern -> V8 Atomic -> V9 Ash"
    creature_states: "C0 Proto-chemistry -> C1 Protocell -> C2 Cell -> C2A/B/C Primary Trait -> C3 Coordinated Colony -> C4 Multicellular Organism -> C5 Adapted Organism -> C6 Cognitive Organism -> C7 Sapient Species"
    presentation_beats: "PB00-PB30"
    hard_rules:
      - "AP UI appears only from G008, not in Iteration 4"
      - "G008/C3 is still pre-multicellular; V1 -> V2 and C4 begin only on G009/MS02"
      - "Cognition appears only after Nervous System"
      - "Power appears only in Industry"
      - "Modern is a distinct full visual state"
      - "World Tension appears only after Atomic transition"
      - "Ash derives visually from the player's own V8 world"
      - "Sapience explicitly changes scale from individual organism to small group"
  sessions:
    DS-00: { name: "Documentation orchestration and repository structure", status: done }
    DS-01: { name: "Civilization gameplay contract", status: reconciled }
    DS-02: { name: "Goals, events and first ending contract", status: reconciled }
    DS-03: { name: "Technical architecture and data contract", status: accepted_architecture_content_refs_reconciled }
    DS-04: { name: "Meta progression and balance rules", status: reconciled }
    RECONCILIATION: { name: "Original GDD design reconciliation", status: accepted }
    DS-05: { name: "Timeline #1 full narrative package", status: accepted }
    DS-05.5: { name: "Timeline presentation contract", status: accepted }
    DS-06: { name: "UX architecture and wireframes", status: accepted }
    DS-07: { name: "Art direction, creature evolution, locations and era transitions", status: accepted }
    DS-08: { name: "Art production manifest and generation prompts", status: global_layout_approval }
    DS-09: { name: "Audio design and generation package", status: ready }
    DS-10: { name: "Analytics, platform and production readiness", status: blocked_by_gameplay_ux_stability }
    DS-11: { name: "Cross-document consistency pass and design freeze", status: blocked_by_code_rework_and_balance }

