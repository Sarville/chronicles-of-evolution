timeline_01_rebuild:
  status: "in_progress"
  target_ruleset: "timeline1-v8-civilization-chains"
  scope: "RNA to mandatory first Ash/Archive/reset, target 105-120 active minutes"
  first_package: "T1-0 Foundation + Event Engine + 0-18 audit"
  canonical_plan: "docs/production/TIMELINE_01_REBUILD_PLAN.md"
  preserved_baseline: "timeline1-v2-reconciled biological 0-18, subject to explicit full-run validation"
  blocker_for_t2_runtime: "T1-7 full-run regression and manual fresh-state playtest"

iteration_4:
  status: "done_user_confirmed"
  completion_source: "user confirmation on 2026-09-16"
  completion_commit: "79e7b93ea5bde181ff77ad8c6d281449cc5be1d8"
  scope:
    - "C01 Metabolism, C02A/B/C first branch (Absorption/Symbiosis/Shell), C03 Protein Synthesis/Ribosome, C04A/B/C optional Photosynthesis/Chemosynthesis/Efficient Digestion, C05 Organelles, C06 Cell Coordination"
    - "PROC_BIOMASS_UPTAKE / PROC_RESPIRATION producers"
    - "G006 = Metabolism + branch resolved (composite), G007 = Protein Synthesis + Organelles + Cell Coordination (C06), matching docs/gdd/07_GOALS_AND_MILESTONES.md and docs/scenario/01_TIMELINE_01_SCRIPT.md exactly; 3 optional C04x side goals"
    - "run.bio.primary_trait / run.bio.absorption|symbiosis|shell and run.bio.metabolism.photosynthesis|chemosynthesis flags set on branch/optional-node purchase, per docs/scenario/05_NARRATIVE_FLAGS.md"
    - "AP resource and its first grant deliberately NOT implemented yet: canon ties it to G008 (~20-24min, Multicellularity track) which is Iteration 5 scope"
    - "fixed dangling ATP visibleFromEra ('METABOLISM' -> 'CELLULAR')"
    - "dev/simulation.js generalized past M06 through C06, plus a Symbiosis (C02B) branch-variant profile"
  consistency_fix_2026-09-16:
    - "Initial implementation (79e7b93e) wired C01/C03/C05/C06 to goalIds G006-G009 directly by node order, colliding with the canonical G006-G009 contract in docs/gdd/07_GOALS_AND_MILESTONES.md and docs/scenario/01_TIMELINE_01_SCRIPT.md (G008=AP/adaptations, G009=Multicellularity MS02, neither of which exists yet). Found while checking DS-05 narrative consistency and corrected in the same session: goals.js now has exactly G006 (composite: C01 + branch_selected) and G007 (nodeId C06, folds Protein Synthesis+Organelles+Cell Coordination); the premature 1 AP grant, the 'ap' resource, and the invented MS_CELL_COORDINATION milestone were removed. Added two small reusable engine primitives: 'branch_selected' goal condition and 'set_flag' node effect (used for the run.bio.* flags above)."
  automated_gate:
    - "npm run test:config / test:domain / test:sim / test:ui / test / smoke / build all pass"
    - "competent-profile simulation: Metabolism ~11.3min, branch ~12.1min, Protein Synthesis ~13.75min, Organelles ~14.75min, Cell Coordination ~15.9min (G006 target 11-14min, G007 target 15-20min per canon: both hit)"
  note: "Closed by direct user confirmation on 2026-09-16, ahead of a manual 10-18 playtest pass. Automated tests/simulation/build back the implementation, and goal-ID alignment with GDD/DS-05 canon is now verified; treat exact 10-18 numbers as provisional (see balance.biological_10_18) until an actual playtest happens."

balance:
  ruleset_target: "timeline1-v8-civilization-chains"
  old_0_10_ei_balance: "historical_superseded"
  biological_numbers: "0_10_original_resource_flow_corrected"
  post_cell_numbers: "iteration_4_implemented_pending_full_0_120_validation"
  civilization_numbers: "provisional_until_full_rebalance"
  crisis_contract: "accepted_pending_regression"
  biological_0_10:
    status: "accepted_with_original_resource_flow_and_storage_caps"
    freeze_scope:
      - "M01-M06"
      - "RNA/DNA producer economics, corrected to preserve legacy RNA→DNA consumption"
      - "finite resource storage, original-role capacity expansions and capacity buildings"
      - "producer milestone thresholds and multipliers"
      - "manual RNA"
      - "manual DNA"
      - "canonical 9-11 min Cell pacing"
