    DS-06: { name: "UX architecture and wireframes", status: unlocked }
    DS-07: { name: "Art direction, locations and era transitions", status: blocked_by_ds05_ds06 }
    DS-08: { name: "Art production manifest and generation prompts", status: blocked_by_ds07 }
    DS-09: { name: "Audio design and generation package", status: blocked_by_ds05_ds07 }
