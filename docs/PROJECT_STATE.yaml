act1_chapters:
  authority: "docs/production/TIMELINE_01_REBUILD_PLAN.md §4/§7 -- but see model_correction below, ACT-002's starting-condition model is superseded pending a DECISIONS_ACT_STRUCTURE.md rewrite"
  model_correction:
    date: "2026-09-18"
    status: "discussed_with_user_not_yet_written_into_decisions"
    summary: "ACT-002 said each T2-T5 chapter gets a targeted starting condition (dispersed_start/defense kit/etc.) and does not replay the biological stage. User corrected this: every attempt replays from RNA again; per-attempt budget grows (T1~20min/T2~25/T3~30/T4~35/T5~40); the already-seen portion is compressed by AF-bought 'Archive Recall' perks (docs/gdd/10_META_PROGRESSION.md sec.4 -- cost x0.75/production x1.25 on familiar progression, NOT implemented in code); visual/species differentiation happens at an existing branch-choice moment (e.g. T2's reskin = Archive fixing the C02A/B/C pick), not a new starting screen. DECISIONS_ACT_STRUCTURE.md ACT-002 needs rewriting before T2 starts. T1 pacing retune (see packages.T1_origin_retrofit) is now done; Archive Recall remains the other prerequisite."
  packages:
    T1_origin_retrofit: { status: done, delivered: "G025/G026, EV-NAR-04/EV-CR-T1, ENDING_BLIGHT implemented 2026-09-18. T1 now ends at Tribe (T05/G015) with the mandatory Мор collapse instead of auto-advancing into the old G016+ Settlement continuation; that content is untouched in config, reused later by T2-T5. Generalized the previously-Ash-only ending/reset machinery (domain/services/crisis.js completeEnding, domain/commands.js ENDING_RESET_PROFILES) so it now supports multiple endings. Мор is a real hidden ~2min timer (CHAPTER_TIMERS.chapter1_blight): Population decays gently then collapses to exactly 0 in the final 15s, EV-CR-T1 fires only on timer expiry (not on population hitting 0 early), player keeps agency but nothing stops the outcome. Pacing retuned 2026-09-18 to actually hit the ~20min chapter target: uniform x3.5 rate rebalance (config/producers.js, config/jobs.js Tribe-era output, domain/services/population.js GROWTH_PER_SECOND) instead of a node-by-node redesign -- costs/thresholds/relative proportions between phases untouched, everything just reached faster. Measured (optimized/competent/slow): Tribe 17.10/17.83/18.08m, full T1 incl. Мор timer 19.87m for competent. Ruleset timeline1-v14-blight-timer. No manual playtest at the new pacing yet." }
    T2_dispersed: { status: not_started, blocked_by: "model_correction above -- no per-chapter start-grant factory needed, but the Archive Recall perk system is still a prerequisite (T1 pacing retune is done)" }
    T3_fortress: { status: not_started }
    T4_big_brain: { status: not_started }
    T5_synthesis_reframe: { status: not_started, note: "existing Modern->Atomic->Ash content (G016-G024, T07-T18, A01-A04, crisis flow) is reused here unchanged, plus the new t5_synthesis procedural deck" }
    act1_closeout: { status: not_started }

