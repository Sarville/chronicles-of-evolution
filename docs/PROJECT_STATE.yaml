  scope:
    - "C01 Metabolism, C02A/B/C first branch (Absorption/Symbiosis/Shell), C03 Protein Synthesis/Ribosome, C04A/B/C optional Photosynthesis/Chemosynthesis/Efficient Digestion, C05 Organelles, C06 Cell Coordination"
    - "PROC_BIOMASS_UPTAKE / PROC_RESPIRATION producers"
    - "G006 = Metabolism + branch resolved (composite), G007 = Protein Synthesis + Organelles + Cell Coordination (C06), matching docs/gdd/07_GOALS_AND_MILESTONES.md and docs/scenario/01_TIMELINE_01_SCRIPT.md exactly; 3 optional C04x side goals"
    - "run.bio.primary_trait / run.bio.absorption|symbiosis|shell and run.bio.metabolism.photosynthesis|chemosynthesis flags set on branch/optional-node purchase, per docs/scenario/05_NARRATIVE_FLAGS.md"
