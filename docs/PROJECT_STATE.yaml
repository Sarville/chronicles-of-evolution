schema_version: 1
project:
  name: "Хроники Эволюции"
  repository: "Sarville/chronicles-of-evolution"
  scope: "Timeline #1 vertical slice: life -> sapience -> civilization -> industry -> atomic crisis -> Ash -> reset -> Timeline #2 teaser"
  work_mode: "documentation_design_and_parallel_implementation"
  last_updated: "2026-09-15"

authority:
  project_status: "docs/PROJECT_STATE.yaml"
  human_todo_view: "docs/TODO.md"
  decisions: "docs/DECISIONS.md"
  technical_contract: "docs/technical/00_TECHNICAL_OVERVIEW.md"
  glossary: "docs/GLOSSARY.md"
  design_session_plan: "docs/production/DESIGN_SESSION_PLAN.md"
  implementation_plan: "docs/production/IMPLEMENTATION_ITERATION_PLAN.md"
  implementation_handoff: "docs/production/DS03_CODEX_HANDOFF.md"

status_values: [todo, ready, active, review, done, blocked, paused, partial]

workflow:
  user_review_required_before_session_done: true
  one_primary_design_block_per_chat: true
  state_update_required_at_session_end: true
  todo_update_required_at_session_end: true
  decisions_update_when_needed: true
  push_after_approval: true

design:
  current_session: "DS-04"
  last_completed_session: "DS-03"
  sessions:
    DS-00:
      name: "Documentation orchestration and repository structure"
      status: done
      outputs:
        - "docs/README.md"
        - "docs/DECISIONS.md"
        - "docs/GLOSSARY.md"
        - "docs/TODO.md"
        - "docs/PROJECT_STATE.yaml"
        - "docs/production/DESIGN_SESSION_PLAN.md"
        - "docs/production/STATE_WORKFLOW.md"
    DS-01:
      name: "Civilization gameplay contract"
      status: done
      depends_on: [DS-00]
      outputs:
        - "docs/gdd/04_CIVILIZATION_PROGRESSION.md"
        - "docs/gdd/05_BUILDINGS_AND_JOBS.md"
        - "docs/gdd/06_TECH_TREE.md"
    DS-02:
      name: "Goals, events and first ending contract"
      status: done
      depends_on: [DS-01]
      outputs:
        - "docs/gdd/07_GOALS_AND_MILESTONES.md"
        - "docs/gdd/08_EVENTS_AND_CHOICES.md"
        - "docs/gdd/09_ENDINGS_AND_RESET.md"
      accepted_contracts:
        - "G001-G024 define the first Timeline core-goal sequence"
        - "World Tension is UI presentation of 100 - Stability"
        - "Timeline #1 converges to ENDING_ASH; choices affect subtype, Chronicle, flags and reward evaluation"
        - "Archive Fragments are first-reset spendable currency; Archive Memory is the meta-system name"
        - "first reset target is 14-18 AF"
        - "reset writes Chronicle/meta before replacing run state and must be idempotent"
    DS-03:
      name: "Technical architecture and data contract"
      status: done
      depends_on: [DS-01, DS-02]
      outputs:
        - "docs/technical/00_TECHNICAL_OVERVIEW.md"
        - "docs/technical/02_DOMAIN_ADAPTER.md"
        - "docs/technical/03_GAME_STATE.md"
        - "docs/technical/04_SAVE_ARCHITECTURE.md"
        - "docs/technical/07_TESTING_STRATEGY.md"
      accepted_contracts:
        - "Strangler / anti-corruption architecture; no full Evolve rewrite"
        - "Chronicles GameState is canonical authority for new Timeline gameplay"
        - "gameplay config is serializable ESM under src/chronicles/config"
        - "presentation mutates gameplay only through commands; domain emits immutable events and exposes selectors"
        - "legacy global, jQuery, Vue/Buefy and DOM-coupled helpers are not public domain APIs"
        - "new save namespace chronicles_evolution is versioned and separate from legacy evolved"
        - "arbitrary legacy Evolve progress is not automatically migrated into Timeline #1"
        - "run/meta/settings are persisted separately; derived prices/rates/World Tension are recalculated"
        - "first reset uses recoverable pending/backup write and idempotent transaction IDs"
        - "Iteration 1 is headless/domain-first and requires config/domain/save/simulation tests"
        - "PlatformPort seam exists now; Yandex/VK SDK details remain DS-10"
        - "production UI framework remains deferred to DS-06 / UI implementation"
    DS-04:
      name: "Meta progression and balance rules"
      status: ready
      depends_on: [DS-02, DS-03]
      outputs:
        - "docs/gdd/10_META_PROGRESSION.md"
        - "docs/gdd/11_BALANCE_RULES.md"
    DS-05:
      name: "Timeline #1 full narrative package"
      status: ready
      depends_on: [DS-02]
      outputs:
        - "docs/scenario/01_TIMELINE_01_SCRIPT.md"
        - "docs/scenario/04_STORY_EVENTS.md"
        - "docs/scenario/05_NARRATIVE_FLAGS.md"
        - "docs/scenario/06_ENDINGS_COPY.md"
        - "docs/scenario/07_COPY_GUIDE.md"
    DS-06:
      name: "UX architecture and wireframes"
      status: ready
      depends_on: [DS-01, DS-02, DS-03]
      outputs:
        - "docs/ux/00_UX_PRINCIPLES.md"
        - "docs/ux/01_SCREEN_MAP.md"
        - "docs/ux/02_MOBILE_WIREFRAMES.md"
        - "docs/ux/03_DESKTOP_WIREFRAMES.md"
        - "docs/ux/04_COMPONENT_STATES.md"
        - "docs/ux/05_TUTORIAL_AND_HINTS.md"
    DS-07:
      name: "Art direction, locations and era transitions"
      status: blocked
      depends_on: [DS-05, DS-06]
    DS-08:
      name: "Art production manifest and generation prompts"
      status: blocked
      depends_on: [DS-07]
    DS-09:
      name: "Audio design and generation package"
      status: blocked
      depends_on: [DS-05, DS-07]
    DS-10:
      name: "Analytics, platform and production readiness"
      status: blocked
      depends_on: [DS-03, DS-06]
    DS-11:
      name: "Cross-document consistency pass and design freeze v1"
      status: blocked
      depends_on: [DS-04, DS-05, DS-06, DS-08, DS-09, DS-10]

documentation:
  foundation:
    prd: done
    first_120_gdd: done
    economy_first_120: done
    evolution_tree: done
    narrative_bible: done
    code_audit: done
    docs_structure_plan: done
    implementation_iteration_plan: done
    decisions: done
    glossary: done
    project_state: done
    state_workflow: done
    design_session_plan: done
    ds02_product_inputs: done
  design_docs:
    civilization_progression: done
    buildings_and_jobs: done
    tech_tree: done
    goals_and_milestones: done
    events_and_choices: done
    endings_and_reset: done
    technical_overview: done
    domain_adapter: done
    game_state: done
    save_architecture: done
    testing_strategy: done

implementation:
  mode: "resumed_after_DS03"
  current_iteration: 0
  resume_gate: "open"
  iterations:
    0:
      name: "Repo baseline and code audit"
      status: active
      completed:
        - "static code audit"
        - "architecture/module map"
        - "game loop/resource/save/UI/platform reconnaissance"
      pending:
        - "baseline build confirmation"
        - "baseline bundle size"
        - "baseline startup measurement"
        - "smoke command/script decision"
    1:
      name: "Domain adapter and data foundation"
      status: ready
      depends_on:
        - "Iteration 0 pending baseline tasks complete"
      required_inputs:
        - "docs/technical/00_TECHNICAL_OVERVIEW.md"
        - "docs/technical/02_DOMAIN_ADAPTER.md"
        - "docs/technical/03_GAME_STATE.md"
        - "docs/technical/04_SAVE_ARCHITECTURE.md"
        - "docs/technical/07_TESTING_STRATEGY.md"
        - "docs/gdd/02_ECONOMY_FIRST_120_MINUTES.md"
        - "docs/gdd/03_EVOLUTION_TREE.md"
        - "docs/gdd/04_CIVILIZATION_PROGRESSION.md"
        - "docs/gdd/05_BUILDINGS_AND_JOBS.md"
        - "docs/gdd/06_TECH_TREE.md"
        - "docs/gdd/07_GOALS_AND_MILESTONES.md"
        - "docs/gdd/08_EVENTS_AND_CHOICES.md"
        - "docs/gdd/09_ENDINGS_AND_RESET.md"
    2:
      name: "Save v1 and dev tools"
      status: blocked
      depends_on: ["Implementation Iteration 1"]

parallelization:
  now:
    design: "DS-04 (DS-05/DS-06 also available as parallel design tracks)"
    codex: "complete Iteration 0 baseline, then start Iteration 1"
  after_DS_05_and_DS_06:
    parallel_design_tracks:
      - "DS-07 art"
      - "DS-09 audio after DS-07 direction is accepted"

open_decisions:
  - "Exact production UI framework / degree of Vue 2 reuse; resolve with DS-06 / UI implementation"
  - "Exact Yandex/VK SDK mapping, cloud conflict policy and rewarded flow; resolve in DS-10"
  - "TBD balance values explicitly marked in DS-01/DS-02 remain configurable until balance/meta review"

next_action:
  owner: "Codex + ChatGPT/user in parallel"
  session: "Implementation Iteration 0 + DS-04"
  description: "Codex closes baseline measurements and smoke command, then starts headless Domain Adapter/data foundation from the accepted DS-03 contract. In parallel, design proceeds with DS-04 meta progression and balance rules."
