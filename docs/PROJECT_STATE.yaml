schema_version: 1
project:
  name: "Хроники Эволюции"
  repository: "Sarville/chronicles-of-evolution"
  scope: "Release 1: three-act structure per docs/DECISIONS_ACT_STRUCTURE.md (2026-09-17) -- Act 1 T1-T5 as five short causally-linked chapters (~3-4h total, life -> Ash -> Archive), Act 2 P1-P3 pre-built lopsided-civilization runs, Act 3 the adapted full original Evolve mechanic set. Supersedes the prior 'T1 Origin through T5 Exodus / first Bioseed in 8-12h' framing. Existing T1-0..T1-6 implementation (below) is the reuse baseline for Act 1's chapters, not a discarded build."
  work_mode: "act_structure_redesign_planning"
  last_updated: "2026-09-18"
  documentation_language: "Описания по умолчанию пишутся на русском. Английский допустим только для стабильных идентификаторов, имён файлов, кодовых состояний, enum-подобных меток и закреплённых названий фич."

