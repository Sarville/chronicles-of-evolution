act1_chapters:
  authority: "docs/DECISIONS_ACT_STRUCTURE.md ACT-002 (rewritten 2026-09-18 per model_correction below); docs/production/TIMELINE_01_REBUILD_PLAN.md §4/§7 for the work-package breakdown"
  model_correction:
    date: "2026-09-18"
    status: "written_into_decisions_and_gdd -- docs pass complete, no code yet"
    summary: "ACT-002 said each T2-T5 chapter gets a targeted starting condition (dispersed_start/defense kit/etc.) and does not replay the biological stage. Corrected model, now written into docs/DECISIONS_ACT_STRUCTURE.md ACT-002 and synced across docs/gdd/{01_FIRST_120_MINUTES,07_GOALS_AND_MILESTONES,08_EVENTS_AND_CHOICES,12_LONG_TERM_PROGRESSION_AND_RESET_ROADMAP,13_ACT_ONE_CHAPTERS}.md, docs/production/TIMELINE_01_REBUILD_PLAN.md, docs/scenario/{00_NARRATIVE_BIBLE,01_TIMELINE_01_SCRIPT,05_NARRATIVE_FLAGS,06_ENDINGS_COPY,07_COPY_GUIDE}.md, docs/TODO.md: every attempt replays from RNA again (no per-chapter start-grant factory); per-attempt budget grows (T1~20min/T2~25/T3~30/T4~35/T5~40); the already-seen portion is compressed by AF-bought 'Archive Recall' perks (docs/gdd/10_META_PROGRESSION.md sec.4 -- cost x0.75/production x1.25 on familiar progression, NOT implemented in code); visual/species differentiation happens at the existing C02A/B/C branch-choice event, not a new starting screen."
    recap_goal_granularity:
      date: "2026-09-18"
      summary: "Follow-up decision: the Recall-compressed replay is NOT a literal re-run of an earlier chapter's own goal cards (would be repetitive by T3-T5) -- each chapter gets its own, coarser-grained goal set for whatever range it re-covers (escalating: T1's full 15-step G001-G015 -> T2's own coarser recap -> T3's even coarser recap covering T1+T2 -> T4 covering T1-T3 -> T5 covering T1-T4), starting already at T2 (not only from T3). New goal IDs for each chapter's own recap chain are not assigned yet. G022-G024 (Atomic) is the one exception, reused as-is since no earlier chapter reaches it live."
    narrative_writing_status: "The two new Archive lines per chapter's recap (at the C02A/B/C event and at the site of the previous chapter's own collapse) are written into docs/scenario/01_TIMELINE_01_SCRIPT.md sec.5.1/6.1/7.1/8.1 and docs/scenario/07_COPY_GUIDE.md sec.4.2-4.4. T3's 'Архив знает больше о будущем, чем должен' reveal (docs/scenario/06_ENDINGS_COPY.md sec.T3, 00_NARRATIVE_BIBLE.md) was re-justified: no longer tied to a defense-kit grant (doesn't exist), now tied to the Archive foreshadowing the collapse point during T3's recap."
  packages:
    T1_origin_retrofit: { status: done, delivered: "G025/G026, EV-NAR-04/EV-CR-T1, ENDING_BLIGHT implemented 2026-09-18. T1 now ends at Tribe (T05/G015) with the mandatory Мор collapse instead of auto-advancing into the old G016+ Settlement continuation; that content is untouched in config, reused later by T2-T5. Generalized the previously-Ash-only ending/reset machinery (domain/services/crisis.js completeEnding, domain/commands.js ENDING_RESET_PROFILES) so it now supports multiple endings. Мор is a real hidden ~2min timer (CHAPTER_TIMERS.chapter1_blight): Population decays gently then collapses to exactly 0 in the final 15s, EV-CR-T1 fires only on timer expiry (not on population hitting 0 early), player keeps agency but nothing stops the outcome. Pacing retuned 2026-09-18 to actually hit the ~20min chapter target: uniform x3.5 rate rebalance (config/producers.js, config/jobs.js Tribe-era output, domain/services/population.js GROWTH_PER_SECOND) instead of a node-by-node redesign -- costs/thresholds/relative proportions between phases untouched, everything just reached faster. Measured (optimized/competent/slow): Tribe 17.10/17.83/18.08m, full T1 incl. Мор timer 19.87m for competent. Ruleset timeline1-v14-blight-timer. No manual playtest at the new pacing yet." }
    archive_recall_perks: { status: in_progress, blocked: false, note: "Design accepted 2026-09-18 (docs/gdd/10_META_PROGRESSION.md sec.4). T1, T2 and T3's own style-perk triads (auto/investment/efficiency) are implemented end to end -- config/archiveRecall.js, domain/services/archiveRecall.js, meta.archiveRecall.chapters state, ARCHIVE_RESET perkChoiceId, minimal ui/app.js ending screen; see docs/TODO.md 'Archive Recall perk system + AF removal' for the checklist. AF removed from ENDING_BLIGHT/ENDING_CATACLYSM/ENDING_FRACTURE (T1/T2/T3); ENDING_ASH keeps its AF reward until reframed as T5. Still blocks T4-T5 below: T4's perk table isn't designed/built yet, and T5's 3-perk stacking/scaling isn't either." }
    T2_recap: { status: done, delivered: "G040-G042 recap (RNA->Tribe, 3 coarse steps) + G027-G030 (Agriculture/Settlement live content, Катаклизм rising+choice+ending) implemented 2026-09-18 -- config/goals.js, config/events.js (EV-NAR-T2-RECALL/EV-NAR-T2/EV-CR-T2), config/endings.js ENDING_CATACLYSM, crisis.js CHAPTER_TIMERS.chapter2_cataclysm. New run.actOneAttempt field + goals.js chapterAttemptVisible gate every main-chain goal (all of T1's G001-G026 tagged chapterAttempt:'T1', T2's tagged 'T2') so the two chapters' goal chains never cross-activate despite sharing the same node/economy data. Also fixed a latent evaluateGoals bug where a sequence's nextGoal could get its already-archived status clobbered back to 'active' when multiple chained goals' conditions come true in one pass (exactly what Recall-compressed recap does) -- see services/goals.js sec. 'Archive Recall can make several chained goals...'. Regression test in tests/domain/spec.js. Skin swap #1 (cosmetic C02A/B/C relabel) and MS11/MS12 milestone banners explicitly NOT built -- MS banners aren't implemented anywhere in code yet (only one MS_PROTOCELL stub exists) and skin swap has no UI hook to attach cosmetic labels to; both are pure polish with zero mechanical effect, deferred to a dedicated pass." }
    T3_recap: { status: done, delivered: "G050/G051 recap (RNA->Settlement, 2 coarse steps, even coarser than T2's 3 despite covering more ground) + G031-G034 (Writing/City live content, Раскол rising+choice+ending) implemented 2026-09-18 -- config/goals.js, config/events.js (EV-NAR-T3-RECALL/EV-NAR-T3/EV-CR-T3), config/endings.js ENDING_FRACTURE, crisis.js CHAPTER_TIMERS.chapter3_fracture. Retargeted the dead T1-only EV-CIV-04 (governance flavor, was trigger goalId:'G019', unreachable since T1 never reaches City) to G032 instead of adding a duplicate -- T3 is the first chapter to actually play City content live. New unlock_auto_workforce mechanic (domain/services/population.js applyAutoWorkforce, called from engine.tick) backs T3's auto perk: idle population auto-fills era jobs, a job stuck at its output resource's cap auto-reassigns elsewhere. New chapter_timer_duration_multiplier modifier (crisis.js chapterTimerTotalMs) backs the efficiency perk (docs describe an early Stability/policy threshold that doesn't exist pre-Atomic -- reinterpreted as stretching the collapse timer's gentle phase). Regression tests in tests/domain/spec.js. Skin swap and MS13/14 banners not built, same reasons as T2." }
    T4_recap: { status: not_started, blocked_by: "archive_recall_perks -- T4's own perk triad + collapse (Авария) not designed yet" }
    T5_synthesis_reframe: { status: not_started, blocked_by: "archive_recall_perks", note: "existing Modern->Atomic->Ash content (G016-G024, T07-T18, A01-A04, crisis flow) is reused here unchanged, plus the new t5_synthesis procedural deck" }
    act1_closeout: { status: not_started }

