    - "data-driven config and validators"
    - "canonical GameState / commands / events / selectors"
    - "generic Goal Engine"
    - "save v1 / autosave / recovery"
    - "dev speed and tools"
    - "telemetry hooks"
    - "headless simulation"
    - "branch/optional support"
    - "idempotent reset foundation"
  iterations:
    0: { name: "Repo baseline and code audit", status: done }
    1: { name: "Domain adapter and data foundation", status: done }
    2: { name: "Save v1 and dev tools", status: done }
    3: { name: "Goal Engine + tutorial shell + superseded early content", status: technically_done_content_rework_required }
    reconciliation_rework:
      name: "Biological gameplay reconciliation implementation"
      status: ready
      scope:
        - "replace current 0-10 E/I content with RNA/DNA/Cell canon"
        - "migrate config and Goal Engine content"
        - "preserve architecture"
        - "update tests and simulation"
        - "rebalance 0-10 from scratch"
        - "manual playtest 0-10"
    4:
      name: "First corrected content expansion after Cell"
      status: blocked_by_reconciliation_rework

iteration_4:
  status: "blocked_by_reconciliation_rework"
  unblock_conditions:
    - "Biological gameplay reconciliation implementation passes"
    - "0-10 rebalance passes"
    - "manual 0-10 playtest approved"

balance:
