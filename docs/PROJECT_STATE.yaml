schema_version: 1
project:
  name: "Хроники Эволюции"
  repository: "Sarville/chronicles-of-evolution"
  scope: "Timeline #1 vertical slice: life -> sapience -> civilization -> industry -> atomic crisis -> Ash -> reset -> Timeline #2 teaser"
  work_mode: "documentation_design_and_parallel_implementation"
  last_updated: "2026-09-15"

authority:
  project_status: "docs/PROJECT_STATE.yaml"
  human_todo_view: "docs/TODO.md"
  decisions: "docs/DECISIONS.md"
  decisions_addenda:
    - "docs/DECISIONS_DS03.md"
    - "docs/DECISIONS_DS04.md"
  technical_contract: "docs/technical/00_TECHNICAL_OVERVIEW.md"
  glossary: "docs/GLOSSARY.md"
  design_session_plan: "docs/production/DESIGN_SESSION_PLAN.md"
  implementation_plan: "docs/production/IMPLEMENTATION_ITERATION_PLAN.md"
  implementation_handoff: "docs/production/DS03_CODEX_HANDOFF.md"

workflow:
  user_review_required_before_session_done: true
  one_primary_design_block_per_chat: true
  state_update_required_at_session_end: true
  todo_update_required_at_session_end: true
  decisions_update_when_needed: true
  push_after_approval: true

design:
  current_session: "DS-05"
  last_completed_session: "DS-04"
  sessions:
    DS-00: { name: "Documentation orchestration and repository structure", status: done }
    DS-01: { name: "Civilization gameplay contract", status: done, depends_on: [DS-00] }
    DS-02: { name: "Goals, events and first ending contract", status: done, depends_on: [DS-01] }
    DS-03: { name: "Technical architecture and data contract", status: done, depends_on: [DS-01, DS-02] }
    DS-04:
      name: "Meta progression and balance rules"
      status: done
      depends_on: [DS-02, DS-03]
      outputs:
        - "docs/gdd/10_META_PROGRESSION.md"
        - "docs/gdd/11_BALANCE_RULES.md"
        - "docs/DECISIONS_DS04.md"
      accepted_contracts:
        - "first reset target remains 14-18 AF; AF reward is idempotent and not multiplied by ads/meta"
        - "Archive Recall is automatic after first reset for familiar pre-Sapience CORE: cost x0.75, production x1.25"
        - "Timeline #2 Sapience p50 target is 20-28 minutes; no-spend 24-28, typical Tier1 20-25"
        - "familiar CORE effective cost floor is 70%; pre-Sapience meta production cap is x1.60"
        - "AR05 retains one OPTIONAL biological node after original prerequisites"
        - "AR06 removes second cellular branch x2.5 penalty without dual numeric stacking"
        - "AR09 allows one secondary biological trait at 65% numerical effect"
        - "offline: Timeline #1 50%, AR04 60%, future hard cap 75%"
        - "Archive Intervention balance envelope: x1.50, 120s base, <=180s, <=3 charges, no stacking"
    DS-05: { name: "Timeline #1 full narrative package", status: ready, depends_on: [DS-02] }
    DS-06: { name: "UX architecture and wireframes", status: ready, depends_on: [DS-01, DS-02, DS-03] }
    DS-07: { name: "Art direction, locations and era transitions", status: blocked, depends_on: [DS-05, DS-06] }
    DS-08: { name: "Art production manifest and generation prompts", status: blocked, depends_on: [DS-07] }
    DS-09: { name: "Audio design and generation package", status: blocked, depends_on: [DS-05, DS-07] }
    DS-10: { name: "Analytics, platform and production readiness", status: blocked, depends_on: [DS-03, DS-06] }
    DS-11: { name: "Cross-document consistency pass and design freeze v1", status: blocked, depends_on: [DS-04, DS-05, DS-06, DS-08, DS-09, DS-10] }

documentation:
  foundation: done
  ds01_gameplay_contract: done
  ds02_goals_events_ending: done
  ds03_technical_contract: done
  meta_progression: done
  balance_rules: done
  narrative_package: ready
  ux_package: ready

